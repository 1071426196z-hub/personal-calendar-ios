name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - ios/**
      - prototype/dates.js
      - prototype/vendor/**
      - .github/workflows/build-ios.yml
  pull_request:
    branches: [main]
    paths:
      - ios/**
      - prototype/dates.js
      - prototype/vendor/**
      - .github/workflows/build-ios.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check calendar time zones and holiday decoding
        run: |
          xcrun swiftc -parse-as-library ios/CalendarApp/CalendarCore.swift \
            ios/CalendarApp/HolidaySchedule.swift ios/Tests/CalendarDataChecks.swift -o "$RUNNER_TEMP/calendar-data-checks"
          "$RUNNER_TEMP/calendar-data-checks"
      - name: Verify Xcode and package the arm64 app
        run: |
          xcodebuild -version
          bash ios/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: ios/build-output/PersonalCalendar.ipa
          archive: false
          if-no-files-found: error
      - name: Launch on iPhone 18 Pro Max simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices booted -j | jq -r '[.devices[] | .[] | select(.name == "iPhone 18 Pro Max") | .udid] | first // empty')"
          if [[ -z "$device" ]]; then
            device="$(xcrun simctl list devices available -j | jq -r '
              [.devices | to_entries | sort_by(.key) | reverse | .[] |
                select(.key | contains("SimRuntime.iOS-27")) | .value[] |
                select(.name == "iPhone 18 Pro Max") | .udid] | first // empty')"
          fi
          test -n "$device"
          echo "CALENDAR_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcodebuild -project ios/PersonalCalendar.xcodeproj -scheme PersonalCalendar \
            -configuration Debug -destination "id=$device" -derivedDataPath "$RUNNER_TEMP/calendar-sim" \
            -only-testing:CalendarUITests CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/calendar-sim/Build/Products/Debug-iphonesimulator/PersonalCalendar.app"
          installed="$(xcrun simctl get_app_container "$device" app.personalglass.calendar app)"
          test -f "$installed/PlugIns/PersonalCalendarWidgets.appex/PersonalCalendarWidgets"
          xcrun simctl launch "$device" app.personalglass.calendar
          sleep 3
          xcrun simctl spawn "$device" launchctl list | grep -F app.personalglass.calendar
          xcrun simctl io "$device" screenshot ios/build-output/iPhone-18-Pro-Max.png
          xcrun simctl launch --terminate-running-process "$device" app.personalglass.calendar --verify-import-screen
          sleep 2
          xcrun simctl io "$device" screenshot ios/build-output/iPhone-18-Pro-Max-Import.png
      - name: Upload simulator screenshot and checksum
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            ios/build-output/PersonalCalendar.ipa.sha256
            ios/build-output/iPhone-18-Pro-Max.png
            ios/build-output/iPhone-18-Pro-Max-Import.png
          if-no-files-found: error
      - name: Test calendar swipe gestures
        timeout-minutes: 8
        run: |
          xcodebuild -project ios/PersonalCalendar.xcodeproj -scheme PersonalCalendar \
            -configuration Debug -destination "id=$CALENDAR_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/calendar-sim" \
            -parallel-testing-enabled NO -only-testing:CalendarUITests CODE_SIGNING_ALLOWED=NO test-without-building
